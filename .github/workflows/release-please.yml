name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Conventional commits (feat:, fix:, ...) on main open a release PR that
      # bumps package.json and CHANGELOG.md; merging it tags and publishes the release.
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
