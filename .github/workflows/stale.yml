name: stale

on:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "pinned,security,good first issue,help wanted"
          exempt-pr-labels: "pinned,security"
          stale-issue-message: "No activity for 60 days. Comment to keep this issue open, or it closes in 14 days."
          stale-pr-message: "No activity for 60 days. Push or comment to keep this pull request open, or it closes in 14 days."
