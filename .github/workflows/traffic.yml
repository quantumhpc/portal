name: traffic

# GitHub keeps traffic data for 14 days only. Each week, save views, clones,
# referrers and popular paths to the `traffic` branch (one JSON file per run).
# Needs a TRAFFIC_TOKEN secret: a fine-grained token on this repository with
# "Administration: read". Without it the job is skipped.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
    steps:
      - name: Skip without a token
        if: env.TRAFFIC_TOKEN == ''
        run: echo "::notice::TRAFFIC_TOKEN is not set; nothing archived."
      - uses: actions/checkout@v7
        if: env.TRAFFIC_TOKEN != ''
        with:
          fetch-depth: 0
      - name: Save this week's traffic
        if: env.TRAFFIC_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin traffic && git switch traffic || git switch --orphan traffic
          day=$(date -u +%F)
          mkdir -p data
          {
            echo '{'
            for k in views clones popular/referrers popular/paths; do
              printf '"%s": ' "$k"
              gh api "repos/$REPO/traffic/$k"
              [ "$k" = popular/paths ] || echo ','
            done
            echo '}'
          } > "data/$day.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: traffic $day" || exit 0
          git push origin traffic
