# QuantumHPC Portal — nginx TLS reverse proxy
# Copy to /etc/nginx/conf.d/qhpc-portal.conf, set server_name and the
# certificate paths, then: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name portal.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name portal.example.org;

    ssl_certificate     /etc/pki/tls/certs/portal.example.org.crt;
    ssl_certificate_key /etc/pki/tls/private/portal.example.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Job input files can be large; raise or set to 0 for unlimited.
    client_max_body_size 10g;
    proxy_request_buffering off;

    # Browser remote desktops (noVNC): WebSocket to websockify, only after the
    # portal confirms the logged-in user owns the session token.
    # See docs/remote-desktop.md. Remove both blocks if you don't use remote desktops.
    location /vnc-ws {
        auth_request /_vnc_authorize;
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 12h;
        proxy_buffering off;
    }

    location = /_vnc_authorize {
        internal;
        proxy_pass http://127.0.0.1:3000/api/vnc/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (harmless for the portal; remote desktops use /vnc-ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
